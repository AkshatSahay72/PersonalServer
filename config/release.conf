# PersonalServer Release Configuration
# Controls production update channels and automatic update preflights

# Target release branch/channel (default: main)
CHANNEL=main

# Upstream git remote name
REMOTE=origin

# Preflight update check on service startup (true/false)
# Automatically syncs node with production (main) branch when services start
AUTO_UPDATE_ON_START=true

# Maximum time in seconds for git remote preflight check
PREFLIGHT_TIMEOUT_SEC=10

# Require verification of critical files and syntax before applying
STRICT_INTEGRITY=true

# If remote is unreachable or network is offline, continue starting existing services
OFFLINE_SAFE=true
